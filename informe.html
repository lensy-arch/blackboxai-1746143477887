<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Informe de Compras - Bazar</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4">
  <header class="mb-6">
    <h1 class="text-3xl font-bold text-gray-800">Informe de Compras</h1>
  </header>

  <section class="w-full max-w-5xl bg-white rounded-lg shadow p-6 overflow-x-auto">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-blue-600 text-white">
          <th class="px-4 py-2">Fecha</th>
          <th class="px-4 py-2">Nombre del Comprador</th>
          <th class="px-4 py-2">Productos</th>
          <th class="px-4 py-2">Total a Pagar (USD)</th>
          <th class="px-4 py-2">Cantidad Pagada (USD)</th>
          <th class="px-4 py-2">Cambio (USD)</th>
        </tr>
      </thead>
      <tbody id="purchase-report-body" class="bg-white">
        <!-- Purchase reports will be dynamically inserted here -->
      </tbody>
    </table>
  </section>

  <div class="mt-6">
    <a href="index.html" class="inline-block bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Volver al Inicio</a>
  </div>

  <script>
    function getPurchases() {
      const purchases = localStorage.getItem('purchases');
      return purchases ? JSON.parse(purchases) : [];
    }

    function renderPurchases() {
      const purchases = getPurchases();
      const tbody = document.getElementById('purchase-report-body');
      tbody.innerHTML = '';

      if (purchases.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-gray-500">No hay compras registradas</td></tr>';
        return;
      }

      purchases.forEach(purchase => {
        const tr = document.createElement('tr');
        tr.className = 'border-b hover:bg-gray-50 transition';

        const productsList = purchase.products.map(p => 
          `${p.name} (x${p.quantity}) - $${p.price.toFixed(2)}`
        ).join('<br>');

        tr.innerHTML = `
          <td class="px-4 py-2">${purchase.date}</td>
          <td class="px-4 py-2">${purchase.buyerName}</td>
          <td class="px-4 py-2">${productsList}</td>
          <td class="px-4 py-2">$${purchase.totalPay.toFixed(2)}</td>
          <td class="px-4 py-2">$${purchase.amountPaid.toFixed(2)}</td>
          <td class="px-4 py-2">$${purchase.change.toFixed(2)}</td>
        `;

        tbody.appendChild(tr);
      });
    }

    renderPurchases();
  </script>
</body>
</html>
